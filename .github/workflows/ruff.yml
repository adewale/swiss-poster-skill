name: Ruff

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uvx ruff@0.16.0 check docs/pr/ablation-studies docs/pr/before-after docs/pr/characterization-contact-sheet docs/pr/diverse-before-after evals scripts
